name: Publish Abyss Guild Armory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out existing guild archive
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original archive parser and analytics
        run: npm test
      - name: Generate raid, character, loot, and roll archives
        run: npm run build
      - name: Apply Abyss rebrand to published site
        run: node scripts/abyss-brand.mjs --dist
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload generated public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy the Abyss guild archive
        id: deployment
        uses: actions/deploy-pages@v4
